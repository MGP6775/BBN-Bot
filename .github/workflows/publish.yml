name: Build and Publish

on: [push]

jobs:
  build:
    name: Build and Publish to Server
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Pull Project
        uses: actions/checkout@v3.5.2

      - name: install or update deno installation
        run: |
            export DENO_INSTALL="/home/runner/.deno"
            export PATH="${DENO_INSTALL}/bin:${PATH}"
            mkdir -p "${DENO_INSTALL}"
            deno upgrade || (
            curl -fsSL https://deno.land/x/install/install.sh > "${DENO_INSTALL}/.sh";
            sh "${DENO_INSTALL}/.sh"
            )
            echo "DENO_INSTALL=${DENO_INSTALL}" >> $GITHUB_ENV
            echo "PATH=${PATH}" >> $GITHUB_ENV
            deno upgrade

      - name: fetch any uncached dependencies
        run: |
            deno cache --reload=file: ./main.ts

      - name: Compile
        run: deno compile -A --output bbn-bot main.ts

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: "ghcr.io/mgp6775/bbn-bot:latest"

      - name: Deploy
        env:
          HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          sig=$(printf '{}' | openssl dgst -sha256 -hmac "$HOOK_SECRET" | awk '{print $NF}')
          curl -sS --fail-with-body --max-time 600 -X POST -H 'Content-Type: application/json' -H "X-Signature: sha256=$sig" -d '{}' https://bbn.music/hooks/bot
